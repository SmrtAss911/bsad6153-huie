name: Sync Mouser data

on:
  schedule:
    - cron: "41 11,23 * * *"   # 11:41 and 23:41 UTC = 5:41 am and 5:41 pm US Central (standard time)
  workflow_dispatch:            # the "Run workflow" button

permissions:
  contents: read                # the job only reads the repo

concurrency:
  group: mouser-sync            # GitHub queues a second run instead of starting it alongside
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # a normal run takes 8 to 12 minutes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: python ingest/sync.py --trigger "$TRIGGER"
      - name: Freshness check
        if: always()
        env:
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
        run: python scripts/status.py
